name: Node.js CD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            display: AppImage Intel
            artifact: release/*.AppImage
          - os: ubuntu-24.04-arm
            display: AppImage ARM
            artifact: release/*.AppImage
          - os: windows-2025
            display: NSIS Intel
            artifact: release/*-Setup.exe
          - os: macos-26
            display: DMG ARM
            artifact: release/*.dmg
          - os: macos-26-intel
            display: DMG Intel
            artifact: release/*.dmg
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.display }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read Node.js and npm versions from devEngines
        shell: bash
        run: |
          echo "NODE_VERSION=$(jq -r '.devEngines.runtime.version' package.json)" >> "$GITHUB_ENV"
          echo "NPM_VERSION=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Setup NSIS
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Run npm scripts with Git Bash
        if: ${{ runner.os == 'Windows' }}
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install third party dependencies
        run: npm ci

      - name: Build website and server
        run: npm run bld:website && npm run bld:server

      - name: Package application
        run: npm run pkg:desktop

      - name: Upload package to release
        shell: bash
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ${{ matrix.artifact }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
